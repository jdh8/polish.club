<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="2.75 1.06 34.5 34.5">
  <!-- stalk branching to each grape, drawn first so the grapes sit on it -->
  <g fill="none" stroke="#8b5a2b" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="4" d="M20,2.5 V10"/>
    <path stroke-width="3" d="M10.07,15.06 L20,10 L29.94,15.06 M20,10 V26.65"/>
  </g>
  <g fill="#009900">
    <!-- three grapes = three lobes of Libertinus Sans ♣ -->
    <circle cx="10.07" cy="15.06" r="7"/>
    <circle cx="29.94" cy="15.06" r="7"/>
    <circle cx="20" cy="26.65" r="7.5"/>
  </g>
  <!-- highlights so they read as grapes -->
  <g fill="#fff" opacity="0.5">
    <ellipse cx="8.02" cy="12.6" rx="1.64" ry="1.07" transform="rotate(-35 8.02 12.6)"/>
    <ellipse cx="27.89" cy="12.6" rx="1.64" ry="1.07" transform="rotate(-35 27.89 12.6)"/>
    <ellipse cx="17.8" cy="24.02" rx="1.76" ry="1.15" transform="rotate(-35 17.8 24.02)"/>
  </g>
</svg>
