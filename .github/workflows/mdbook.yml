# Sample workflow for building and deploying a mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: Deploy mdBook site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        id: pages
      - name: Install mdbook
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: mdbook
      - name: Install mdbook-abbr
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: mdbook-abbr
      - name: Install mdbook-replace
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: mdbook-replace
      - name: Install PDF toolchain  # cache-apt-pkgs-action hangs in apt-fast here (2026-10-23); it works in ../bridge-tutorial
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-luatex texlive-latex-recommended texlive-latex-extra fonts-noto-cjk librsvg2-bin lmodern texlive-plain-generic texlive-fonts-recommended
      - name: Install Libertinus and Source Code Pro  # Ubuntu has no Libertinus package; fetch the release OTFs
        run: |
          curl -sLO https://github.com/alerque/libertinus/releases/download/v7.051/Libertinus-7.051.zip
          curl -sLO https://github.com/adobe-fonts/source-code-pro/releases/download/2.042R-u/1.062R-i/1.026R-vf/OTF-source-code-pro-2.042R-u_1.062R-i.zip
          unzip -qj Libertinus-7.051.zip '*.otf' -d ~/.fonts
          unzip -qj OTF-source-code-pro-2.042R-u_1.062R-i.zip '*.otf' -d ~/.fonts && fc-cache -f
      - run: mdbook build
      - run: python3 print.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
